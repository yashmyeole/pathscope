name: Qdrant keep-alive

# Qdrant Cloud free clusters suspend after 7 idle days and are deleted after 28.
on:
  schedule:
    - cron: "17 9 */3 * *"   # 09:17 UTC every third day
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet httpx

      - name: Ping cluster
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: pathscope_plip_v1
        run: python scripts/qdrant_ping.py
